name: publish

# A button, never a trigger. A tag push used to start this too, and it failed
# every time on a repository without an NPM_TOKEN secret — which is how a fresh
# public repository ends up with a red cross as the first thing anyone sees.
# Releasing is a decision, so it takes a deliberate click.
#
# Requires an NPM_TOKEN secret with publish rights. Without one, publish from a
# machine that is logged in: npm publish --access public
on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
